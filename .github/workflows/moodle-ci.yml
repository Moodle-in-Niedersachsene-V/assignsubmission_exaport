##############################################################################
# GitHub Actions Workflow fuer Moodle-Plugin-Pruefung
# Moodle in Niedersachsen e. V.
#
# Plugin: assignsubmission_exaport
# Ablage: .github/workflows/moodle-ci.yml
#
# Uebernommen aus tiny_textgestaltung. Angepasst: kein amd/, daher ohne
# AMD-Artefakt; tests/ vorhanden, daher mit phpunit. Benoetigt block_exaport
# als zusaetzliches Plugin (moodle-plugin-ci add-plugin).
##############################################################################

name: Moodle Plugin CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_USER: 'root'
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
          MYSQL_CHARACTER_SET_SERVER: "utf8mb4"
          MYSQL_COLLATION_SERVER: "utf8mb4_unicode_ci"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            moodle-branch: 'MOODLE_501_STABLE'
            database: 'mariadb'
          - php: '8.4'
            moodle-branch: 'MOODLE_502_STABLE'
            database: 'pgsql'

    steps:
      - name: Plugin-Quellcode auschecken
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: PHP ${{ matrix.php }} einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: max_input_vars=5000
          coverage: none

      - name: moodle-plugin-ci installieren
        run: |
          composer create-project -n --no-dev --prefer-dist \
            moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Abhaengigkeit block_exaport hinzufuegen
        run: moodle-plugin-ci add-plugin gtn/exaport

      # Voruebergehender Workaround (A2): block_exaport lib/lib.php deklariert
      # "array $defaultsort = null". PHP 8.4 meldet dafuer eine Deprecation,
      # und moodle-plugin-ci bricht die Installation bei jeder PHP-Meldung ab.
      # Der Fehler liegt in block_exaport, nicht in diesem Plugin; an GTN
      # gemeldet. Sobald GTN "?array" verwendet, laeuft der Schritt ohne
      # Aenderung durch und kann entfernt werden.
      - name: block_exaport fuer PHP 8.4 patchen (Workaround)
        run: |
          file=$(grep -rl 'function block_exaport_parse_sort' moodle-plugin-ci-plugins --include=lib.php || true)
          if [ -z "$file" ]; then
            echo "block_exaport_parse_sort nicht gefunden - Pfad pruefen"; exit 1
          fi
          if grep -q ', array \$defaultsort = null' "$file"; then
            sed -i 's/, array \$defaultsort = null/, ?array $defaultsort = null/' "$file"
            echo "Gepatcht: $file"
          else
            echo "Nicht mehr noetig: block_exaport ist bereits PHP-8.4-sauber"
          fi

      - name: Moodle und Plugin installieren
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: PHP Lint (Syntaxpruefung)
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: PHP Mess Detector
        continue-on-error: true
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpmd

      - name: Moodle Code Checker (Coding Style)
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Plugin-Struktur validieren
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Upgrade-Savepoints pruefen
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: Grunt (CSS-Lint)
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      - name: PHPUnit-Tests
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning
